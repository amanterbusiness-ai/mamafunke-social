<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MamaFunke: Impulse für Mütter</title>
<meta name="description" content="MamaFunke: kurze, ehrliche Impulse für Mütter. Kostenlos für Android und iPhone.">
<meta name="robots" content="noindex">
<link rel="icon" href="/icon.png">
<style>
  :root {
    --night: #071b48; --night-soft: #0d2760; --gold: #ffc538;
    --cream: #fff9f2; --muted: #b7c0ce;
    --serif: Georgia, "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
    background: radial-gradient(120% 80% at 50% 0%, var(--night-soft), var(--night));
    color: var(--cream); font-family: var(--sans); text-align: center;
  }
  main { width: 100%; max-width: 380px; }
  img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
  h1 { font-family: var(--serif); font-weight: 600; font-size: 1.9rem; line-height: 1.2; margin: 20px 0 8px; }
  p { color: var(--muted); line-height: 1.5; margin: 0 0 24px; }
  a.btn {
    display: block; padding: 15px 18px; margin: 10px 0; border-radius: 999px;
    font-weight: 700; text-decoration: none; font-size: 1.05rem;
  }
  .gold { background: var(--gold); color: var(--night); }
  .line { border: 1.5px solid rgba(255,249,242,.35); color: var(--cream); }
  .hint { font-size: .85rem; margin-top: 22px; }
  .hint a { color: var(--muted); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <img src="/icon.png" alt="MamaFunke App-Symbol">
  <h1>Ein Satz nur für dich, Mama.</h1>
  <p>Kurze, ehrliche Impulse für den Mama-Alltag. Ohne Konto, ohne Werbung. Kostenlos.</p>
  <a id="play" class="btn gold" href="#">Bei Google Play laden</a>
  <a id="apple" class="btn line" href="#">Im App Store laden</a>
  <p id="bald" class="hint" hidden>Für iPhone erscheint MamaFunke in Kürze.</p>
  <p class="hint">
    <a href="https://mamafunke.deejay-geerax.chatgpt.site/datenschutz.html">Datenschutz</a> ·
    <a href="https://mamafunke.deejay-geerax.chatgpt.site/impressum.html">Impressum</a>
  </p>
</main>
<script>
  // Diese Seite setzt keine Cookies und lädt nichts nach. Sie gibt nur weiter,
  // von welchem Kanal der Besuch kam (mamafunke.de/ig, /tt, /yt, /fb, /forum), damit die
  // Stores Installationen pro Kanal zählen können.
  var APP_ID_APPLE = '6817131358';
  // Erst auf true setzen, wenn die App im App Store öffentlich ist
  // (https://itunes.apple.com/lookup?id=6817131358&country=de liefert dann ein Ergebnis).
  var APPLE_LIVE = false;
  var APPLE_PROVIDER = '';     // Provider-Token aus App Store Connect, Kampagnen
  var PAKET = 'de.mamafunke.app';

  var erlaubt = ['ig', 'tt', 'yt', 'fb', 'forum', 'pin', 'web', 'creator', 'teilen'];
  // Kanal aus ?k=ig oder aus dem Kurzlink mamafunke.de/ig
  var pfad = location.pathname.split('/').filter(Boolean)[0] || '';
  var k = (new URLSearchParams(location.search).get('k') || pfad || 'web').toLowerCase();
  if (erlaubt.indexOf(k) < 0) k = 'web';

  var referrer = 'utm_source=' + k + '&utm_medium=bio&utm_campaign=social';
  var play = 'https://play.google.com/store/apps/details?id=' + PAKET +
    '&referrer=' + encodeURIComponent(referrer);
  var apple = APP_ID_APPLE && APPLE_LIVE
    ? 'https://apps.apple.com/de/app/id' + APP_ID_APPLE +
      (APPLE_PROVIDER ? '?pt=' + APPLE_PROVIDER + '&ct=' + k + '&mt=8' : '')
    : '';

  document.getElementById('play').href = play;
  var a = document.getElementById('apple');
  if (apple) { a.href = apple; } else { a.hidden = true; document.getElementById('bald').hidden = false; }

  var ua = navigator.userAgent || '';
  var ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var android = /Android/.test(ua);
  if (android) location.replace(play);
  else if (ios && apple) location.replace(apple);
</script>
</body>
</html>
