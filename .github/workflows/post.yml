name: Posten

on:
  schedule:
    - cron: "13,43 * * * *"
  workflow_dispatch:
    inputs:
      check:
        description: "Nur Zugänge prüfen, nichts posten"
        type: boolean
        default: true

concurrency:
  group: posten
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  posten:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fällige Posts veröffentlichen
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          MEDIA_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/main
        run: python scripts/post.py ${{ inputs.check && '--check' || '' }}
      - name: Stand sichern
        if: always()
        run: |
          git config user.name "mamafunke-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/posted.json
          git diff --cached --quiet || (git commit -m "Stand der Veröffentlichungen" && git push)
