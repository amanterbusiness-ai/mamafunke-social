name: Spruch des Tages

on:
  schedule:
    # 00:05 Berlin im Sommer (22:05 UTC) und im Winter (23:05 UTC); das Skript nimmt immer das Berliner Datum
    - cron: "5 22,23 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seite:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/spruch_des_tages.py
      - name: Sichern
        run: |
          git config user.name "mamafunke-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/spruch-des-tages/index.html
          git diff --cached --quiet || (git commit -m "Spruch des Tages aktualisiert" && git pull --rebase && git push)
