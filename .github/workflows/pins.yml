name: Pinterest-Feed

on:
  schedule:
    - cron: "15 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/pins_feed.py
      - name: Sichern
        run: |
          git config user.name "mamafunke-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/pins/feed.xml
          git diff --cached --quiet || (git commit -m "Pinterest-Feed aktualisiert" && git pull --rebase && git push)
